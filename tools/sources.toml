# What keeps the board moving.
#
# Each source says three things and nothing else: where the data comes from,
# how often to ask, and which panel it lands in.
#
#   command / url   where. A command prints JSON on stdout; a URL returns JSON.
#                   {collectors} expands to tools/collectors.
#   every           seconds between runs.
#   history         optional. Keeps the last N rows, so a source that prints one
#                   reading becomes a series without remembering anything itself.
#   json_path       optional, for URLs: a dotted path to dig into the response.
#   panel           the item to write. Anything the board accepts.
#   place           optional x/y/w/h in grid cells; omit to let the board choose.
#   description     optional. The note only sessions read, given to the widget
#                   when it is created: what it is, and what feeds it.
#   transient       optional. The panel exists only while the source has rows to
#                   put in it: no rows, no widget. For a subject that is not
#                   always there.
#
# Commands live here rather than on the board on purpose: the board is open to
# the whole LAN, and a display should not be a way to run code on this machine.

[[source]]
name = "cpu"
command = "python3 {collectors}/cpu.py"
every = 3
place = { x = 0, y = 0, w = 12, h = 7 }
# A shape and nothing else. Eight spokes, one per logical core, and the polygon
# is the whole reading: a spike is one core pegged, a fat blob is all of them.
# That is one glance from the sofa where eight bars were eight heights to scan.
#
# No title and no spoke labels: the icon at the origin says what this is, and a
# core number on each spoke is a thing to read on a widget meant to be
# understood without reading. `axes` is dropped rather than left at `none` — it
# is a cartesian setting and a radar has no cartesian axes. `max` is what holds
# the polygon to 100 now, and the grid behind it stays drawn so an idle machine
# reads as quiet rather than as broken.
#
# The rows arrive already in ring order: `collectors/cpu.py` reads the kernel's
# sibling map and puts the two threads of one physical core side by side. This
# machine enumerates them 0,4 — opposite spokes — and left alone one busy core
# would draw as two thin spikes facing each other instead of one lobe.
panel = { kind = "chart", chart = "radar", x_key = "core", series = ["use"], max = 100, colors = ["#ffffffa6"], icon = "cpu" }

[[source]]
name = "mem"
command = "python3 {collectors}/mem.py"
every = 5
place = { x = 12, y = 0, w = 5, h = 5 }
panel = { kind = "chart", chart = "radial", title = "RAM", x_key = "label", series = ["use"], max = 100, colors = ["#ffffffa6"], unfilled = "#ffffff80", thresholds = [{ at = 77, color = "#ff5c33" }] }

# A darker green than the CPU's, because it is the other vendor's chip. Not a
# warning colour: orange and red on a dashboard mean something is wrong.
[[source]]
name = "gpu"
command = "python3 {collectors}/gpu.py util"
every = 3
place = { x = 17, y = 0, w = 5, h = 5 }
panel = { kind = "chart", chart = "radial", title = "GPU", x_key = "label", series = ["pct"], max = 100, colors = ["#ffffffa6"], unfilled = "#ffffff80" }

[[source]]
name = "vram"
command = "python3 {collectors}/gpu.py vram"
every = 3
place = { x = 22, y = 0, w = 5, h = 5 }
panel = { kind = "chart", chart = "radial", title = "VRAM", x_key = "label", series = ["pct"], max = 100, colors = ["#ffffffa6"], unfilled = "#ffffff80" }

# One reading each time; `history` turns it into four minutes of line.
# 90 °C is the ceiling we chose to draw against, not a hardware limit.
[[source]]
name = "tmux"
command = "python3 {collectors}/tmux_sessions.py"
every = 20
place = { x = 0, y = 7, w = 12, h = 5 }
panel = { kind = "list", title = "tmux", empty = "nenhuma sessão" }


# Two minutes: each pass is one call per feed plus one per push to fetch the
# message, and there is no hurry — a commit is not news by the second.
[[source]]
name = "commits"
command = "python3 {collectors}/github_commits.py --limit 10"
every = 120
timeout = 60
place = { x = 12, y = 5, w = 11, h = 13 }
panel = { kind = "feed", title = "github", icon = "github", empty = "nenhum commit recente" }


# No command: the inbox is filled over the socket, not by polling. This entry
# only keeps the widget on the board, so it comes back after a restart.
[[source]]
name = "inbox"
every = 60
place = { x = 23, y = 5, w = 9, h = 13 }
panel = { kind = "inbox" }

# The machine's own announcements, in the inbox rather than in a panel.
#
# `notifications = true` is the whole difference: the rows this prints are
# notifications already shaped, so there is no `panel` and no `place` — the
# inbox is one widget and it is already on the board.
#
# Five minutes, not five seconds. Nothing here changes quickly, the journal
# query is the most expensive thing this agent runs, and an inbox that fills
# faster than somebody walks past it is a worse inbox. The agent only posts what
# was not already true on the previous run, so a disk that stays full says so
# once rather than every five minutes for a week.
[[source]]
name = "alerts"
command = "python3 {collectors}/alerts.py"
every = 300
notifications = true


# The training run that owns the GPU, in three widgets: what the model is
# learning, how far through it is, and whether the optimiser is behaving.
#
# All three are the same collector called three ways, the way the two gauges
# above are `gpu.py util` and `gpu.py vram`: a source writes one panel, so a
# widget is a call. It finds the run by asking the driver what is on the card
# and reading /proc, so nobody has to point the board at a run by name, and it
# prints no rows at all when nothing on the card has earned a television. That
# is what `transient` is for — an hour after a run ends these three come off the
# board rather than sitting there saying "no data".
#
# A minute, not an hour: this reads a CSV, which costs nothing, and a line that
# grows while you watch it is the difference between a dashboard and a poster.

# The one widget here that says how good the model is; everything else is the
# run's health, so this gets the room. Two lines, dim for the training loss and
# bright for the held-out one, which is the one that matters — no legend, since
# they sit on top of each other and which is which is not the reading. `axes =
# "y"` because the level is the whole point (4.5 nats is a different animal from
# 11) while the x position is what the gauge below already answers. No unit on
# the axis: a loss is in nats and a reader who needs telling that is reading the
# sheets `make report` draws, not a television.
[[source]]
name = "trm_curve"
command = "python3 {collectors}/trm_run.py curve ~/Desktop/Repos/TinyRefinementModel"
every = 60
transient = true
place = { x = 23, y = 4, w = 9, h = 8.5 }
description = """
Cross-entropy against millions of tokens for whichever TinyRefinementModel run owns the GPU: the dim line is the training loss, the bright one the held-out probe. Fed by tools/collectors/trm_run.py through the agent, once a minute, and not hand-maintained — it appears when a real run starts and comes off the board an hour after one ends. The matplotlib sheets `make report` draws in that repository are the same numbers for reading up close."""
panel = { kind = "chart", chart = "line", title = "loss", x_key = "tokens", series = ["train", "held"], axes = "y", colors = ["#ffffff59", "#ffffffd9"] }

# The gradient norm, one bar per sample, in multiples of the clip it is held to
# — so the threshold at 1 is the clip itself whatever the clip is set to that
# week, and a bar that turns is the clip setting the step size rather than the
# schedule. Amber rather than the red the disk alarms use: it is worth noticing,
# not worth getting up for, and early in every run it is normal.
#
# No axes at all. The colour is the reading and the shape is the trend, which is
# the same argument the CPU radar makes for having no spoke labels; a scale in
# multiples of a clip would be a number to work out on a wall nobody reads.
[[source]]
name = "trm_health"
command = "python3 {collectors}/trm_run.py health ~/Desktop/Repos/TinyRefinementModel"
every = 60
transient = true
place = { x = 23, y = 12.5, w = 4, h = 5.5 }
description = """
The training run's gradient norm, each bar a sample across the run, in multiples of the gradient clip — so a bar past 1 turns amber and means the clip is setting the step size rather than the schedule. Fed by tools/collectors/trm_run.py through the agent; it comes and goes with the run, and is not hand-maintained."""
panel = { kind = "chart", chart = "bar", icon = "zap", x_key = "step", series = ["norm"], axes = "none", colors = ["#ffffffa6"], thresholds = [{ at = 1.0, color = "var(--chart-3)" }] }

# How far through the budget the run is. A gauge because a proportion is the one
# thing a room can read without looking twice, and the same white and unfilled
# ring as the three gauges along the top, because it is the same kind of
# reading. The spelled-out line under the title is the one place these three
# widgets write a number out in words — "61.6/67.1M" — and the ring carries the
# rest.
[[source]]
name = "trm_progress"
command = "python3 {collectors}/trm_run.py progress ~/Desktop/Repos/TinyRefinementModel"
every = 60
transient = true
place = { x = 27, y = 12.5, w = 5, h = 5.5 }
description = """
How much of its token budget the training run has done, with the count spelled out under the ring. Fed by tools/collectors/trm_run.py through the agent; the budget is the run's own TRAIN_TOKEN_BUDGET, and the widget comes and goes with the run rather than being hand-maintained."""
panel = { kind = "chart", chart = "radial", title = "tokens", x_key = "label", series = ["pct"], max = 100, colors = ["#ffffffa6"], unfilled = "#ffffff80" }
