# What keeps the board moving.
#
# Each source says three things and nothing else: where the data comes from,
# how often to ask, and which panel it lands in.
#
#   command / url   where. A command prints JSON on stdout; a URL returns JSON.
#                   {collectors} expands to tools/collectors.
#   every           seconds between runs.
#   history         optional. Keeps the last N rows, so a source that prints one
#                   reading becomes a series without remembering anything itself.
#   json_path       optional, for URLs: a dotted path to dig into the response.
#   panel           the item to write. Anything the board accepts.
#   place           optional x/y/w/h in grid cells; omit to let the board choose.
#
# Commands live here rather than on the board on purpose: the board is open to
# the whole LAN, and a display should not be a way to run code on this machine.

[[source]]
name = "cpu"
command = "python3 {collectors}/cpu.py"
every = 3
place = { x = 0, y = 0, w = 12, h = 7 }
panel = { kind = "chart", chart = "bar", title = "CPU por núcleo", x_key = "core", series = ["use"], max = 100, colors = ["var(--chart-2)"] }

[[source]]
name = "mem"
command = "python3 {collectors}/mem.py"
every = 5
place = { x = 12, y = 0, w = 5, h = 5 }
panel = { kind = "chart", chart = "radial", title = "Memória", x_key = "label", series = ["use"], max = 100, unit = "%", colors = ["var(--chart-2)"] }

# A darker green than the CPU's, because it is the other vendor's chip. Not a
# warning colour: orange and red on a dashboard mean something is wrong.
[[source]]
name = "gpu"
command = "python3 {collectors}/gpu.py util"
every = 3
place = { x = 17, y = 0, w = 5, h = 5 }
panel = { kind = "chart", chart = "radial", title = "GPU", x_key = "label", series = ["pct"], max = 100, unit = "%", colors = ["oklch(0.55 0.13 152)"] }

[[source]]
name = "vram"
command = "python3 {collectors}/gpu.py vram"
every = 3
place = { x = 22, y = 0, w = 5, h = 5 }
panel = { kind = "chart", chart = "radial", title = "VRAM", x_key = "label", series = ["pct"], max = 100, unit = "%", colors = ["oklch(0.55 0.13 152)"] }

# One reading each time; `history` turns it into four minutes of line.
# 90 °C is the ceiling we chose to draw against, not a hardware limit.
[[source]]
name = "temps"
command = "python3 {collectors}/temps.py"
every = 2
history = 90
place = { x = 0, y = 7, w = 12, h = 6 }
panel = { kind = "chart", chart = "line", title = "Temperatura (°C)", x_key = "t", series = ["cpu", "gpu"], max = 90, colors = ["var(--chart-2)", "oklch(0.55 0.13 152)"] }

[[source]]
name = "tmux"
command = "python3 {collectors}/tmux_sessions.py"
every = 20
place = { x = 18, y = 7, w = 5, h = 7 }
panel = { kind = "list", title = "tmux", empty = "nenhuma sessão" }


# No command: the inbox is filled over the socket, not by polling. This entry
# only keeps the tile on the board, so it comes back after a restart.
[[source]]
name = "inbox"
every = 60
place = { x = 23, y = 5, w = 9, h = 13 }
panel = { kind = "inbox", title = "notificações" }
