# What keeps the board moving — the example a fresh clone runs from.
#
# The live one is `state/sources.toml`, which this repository does not carry:
# which panels a board has and what feeds them is one instance's data, not the
# board's code. Copy this across to start, edit it there, and never edit it
# here. The agent re-reads that file whenever it changes, so a new panel or a
# different command is a save, not a restart of anything.
#
# Each source says where the data comes from, how often to ask, and what to do
# with it:
#
#   command / url   where. A command prints JSON on stdout; a URL returns JSON.
#                   {collectors} expands to tools/collectors, {state} to the
#                   directory this file is in — so nothing here has to know
#                   where the repository was checked out to.
#   every           seconds between runs.
#   timeout         optional. Seconds a command gets before it is given up on.
#   history         optional. Keeps the last N rows, so a source that prints one
#                   reading becomes a series without remembering anything itself.
#   json_path       optional, for URLs: a dotted path to dig into the response.
#   panel           the item to write. Anything the board accepts.
#   place           optional x/y/w/h in grid cells; omit to let the board choose.
#   page            optional. Which page the panel belongs on. Omit and it goes
#                   on the board's default page — never on whichever page
#                   happened to be showing the first time the panel was written,
#                   which is what a board turned to something else for an
#                   evening used to build its own furniture into. Only the first
#                   write is placed, here as with `place`, so moving a panel to
#                   another page by hand afterwards sticks.
#
# What a source leaves out decides what it is. With a `panel` it is one widget,
# rewritten each time it runs — and with no command either, a widget that only
# has to exist and stay put. With `notifications = true` the rows go to the
# inbox instead. With a command and no panel it is a job: the agent starts it,
# does not wait for it, and does not start a second one while the first is
# running, which is how a watcher that draws its own widgets gets to live in
# `state/` rather than in this repository. See the commented example at the end.
#
# Commands live here rather than on the board on purpose: the board is open to
# the whole LAN, and a display should not be a way to run code on this machine.

[[source]]
name = "cpu"
command = "python3 {collectors}/cpu.py"
every = 3
place = { x = 0, y = 0, w = 12, h = 7 }
# A shape and nothing else. Eight spokes, one per logical core, and the polygon
# is the whole reading: a spike is one core pegged, a fat blob is all of them.
# That is one glance from the sofa where eight bars were eight heights to scan.
#
# No title and no spoke labels: the icon at the origin says what this is, and a
# core number on each spoke is a thing to read on a widget meant to be
# understood without reading. `axes` is dropped rather than left at `none` — it
# is a cartesian setting and a radar has no cartesian axes. `max` is what holds
# the polygon to 100 now, and the grid behind it stays drawn so an idle machine
# reads as quiet rather than as broken.
#
# The rows arrive already in ring order: `collectors/cpu.py` reads the kernel's
# sibling map and puts the two threads of one physical core side by side. This
# machine enumerates them 0,4 — opposite spokes — and left alone one busy core
# would draw as two thin spikes facing each other instead of one lobe.
panel = { kind = "chart", chart = "radar", x_key = "core", series = ["use"], max = 100, colors = ["#ffffffa6"], icon = "cpu" }

[[source]]
name = "mem"
command = "python3 {collectors}/mem.py"
every = 5
place = { x = 12, y = 0, w = 5, h = 5 }
panel = { kind = "chart", chart = "radial", title = "RAM", x_key = "label", series = ["use"], max = 100, colors = ["#ffffffa6"], unfilled = "#ffffff80", thresholds = [{ at = 77, color = "#ff5c33" }] }

[[source]]
name = "gpu"
command = "python3 {collectors}/gpu.py util"
every = 3
place = { x = 17, y = 0, w = 5, h = 5 }
panel = { kind = "chart", chart = "radial", title = "GPU", x_key = "label", series = ["pct"], max = 100, colors = ["#ffffffa6"], unfilled = "#ffffff80" }

[[source]]
name = "vram"
command = "python3 {collectors}/gpu.py vram"
every = 3
place = { x = 22, y = 0, w = 5, h = 5 }
panel = { kind = "chart", chart = "radial", title = "VRAM", x_key = "label", series = ["pct"], max = 100, colors = ["#ffffffa6"], unfilled = "#ffffff80" }

[[source]]
name = "tmux"
command = "python3 {collectors}/tmux_sessions.py"
every = 20
place = { x = 0, y = 7, w = 12, h = 5 }
panel = { kind = "list", title = "tmux", empty = "nenhuma sessão" }


# A panel that belongs somewhere other than the board's own page. The grid is
# 32x18 and full long before everything worth watching has a corner, so a
# reading kept for when it is wanted lives on a page of its own and costs the
# ordinary board nothing. It is fed the whole time it is out of sight: turning
# to `machine` shows what is true now, not what was true when you last looked.
#
# The page is not created anywhere. A page is nothing but a name its widgets
# carry, so declaring one here is all there is to it.
[[source]]
name = "disk"
command = "df -h --output=target,pcent / /home"
every = 300
page = "machine"
place = { x = 0, y = 0, w = 10, h = 4 }
panel = { kind = "note", title = "disk" }


# Two minutes: each pass is one call per feed plus one per push to fetch the
# message, and there is no hurry — a commit is not news by the second.
[[source]]
name = "commits"
command = "python3 {collectors}/github_commits.py --limit 10"
every = 120
timeout = 60
place = { x = 12, y = 5, w = 11, h = 13 }
panel = { kind = "feed", title = "github", icon = "github", empty = "nenhum commit recente" }


# No command: the inbox is filled over the socket, not by polling. This entry
# only keeps the widget on the board, so it comes back after a restart.
[[source]]
name = "inbox"
every = 60
place = { x = 23, y = 5, w = 9, h = 13 }
panel = { kind = "inbox" }

# The machine's own announcements, in the inbox rather than in a panel.
#
# `notifications = true` is the whole difference: the rows this prints are
# notifications already shaped, so there is no `panel` and no `place` — the
# inbox is one widget and it is already on the board.
#
# Five minutes, not five seconds. Nothing here changes quickly, the journal
# query is the most expensive thing this agent runs, and an inbox that fills
# faster than somebody walks past it is a worse inbox. The agent only posts what
# was not already true on the previous run, so a disk that stays full says so
# once rather than every five minutes for a week.
[[source]]
name = "alerts"
command = "python3 {collectors}/alerts.py"
every = 300
notifications = true

# A job: a command with no panel. The agent runs it on this cadence, beside
# itself, and whatever it prints lands in the agent's log — it writes to the
# board itself, with `from agent import Board` (the agent puts its own directory
# in $STARK_HUD_TOOLS for exactly that). This is where an instance's own project
# goes: a watcher in `state/`, not a script in this repository.
#
# [[source]]
# name = "myproject"
# command = "python3 {state}/myproject_watch.py"
# every = 60
