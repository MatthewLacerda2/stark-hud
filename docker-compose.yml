# The board as two long-lived containers.
#
# `restart: unless-stopped` plus a docker daemon enabled at boot is the whole of
# the autostart story: no unit files, and `docker compose stop` still means
# stopped rather than "back after the next reboot".
#
#   docker compose up -d --build     start (and rebuild after a code change)
#   docker compose logs -f           follow
#   docker compose down              stop and remove
#
# The stats pusher stays on the host on purpose: it reads /proc, nvidia-smi and
# tmux, none of which mean anything from inside a container.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # As the human, so the board file it writes is one they can open and edit
    # without sudo. It reads the host's media as that user too.
    user: "1000:1000"
    environment:
      GRID_COLS: 32
      GRID_ROWS: 18
      CORS_ORIGINS: "*"
      # Without this the container is UTC, and anything the backend formats —
      # the times an agent reads back out of the inbox, for one — is hours off
      # from the clock on the wall next to the screen.
      TZ: ${TZ:-America/Fortaleza}
      # The board's voice. Passed through from a `.env` beside this file, which
      # git ignores and a human fills in: this repository is public, and a key
      # in it would be a key on the internet. Empty is a working board that
      # simply cannot speak and says so when something asks it to.
      # Only what is named in this block reaches the container: the `.env` is
      # read by compose for interpolation, not handed to the backend. So to tune
      # the voice — its speed, its stability, any other ELEVENLABS_ setting —
      # add the variable here. Setting it in `.env` alone changes nothing.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Spoken lines land beside the board file, in the one volume the backend
      # can write to. Absolute on purpose, and for the same reason STATE_FILE is
      # below it: the default is a path relative to the backend's working
      # directory, which in here is /app, so leaving this alone would write every
      # MP3 into the container's own filesystem — outside the volume, gone on the
      # next `up --build`, and a 404 for every URL the browser was already
      # handed. Only the newest few are kept.
      SPEECH_DIR: /data/speech
      # The board itself, kept across restarts. Plain JSON under a name of our
      # own, so it can be backed up, edited or swapped for another board.
      STATE_FILE: /data/board.hud
    volumes:
      # Read-write, unlike the rest: this is the one thing the backend owns.
      - ./state:/data
      # Media items hold absolute paths, so the same path has to resolve inside
      # the container. Read-only: the board shows files, it never writes them.
      - /mnt/d_drive:/mnt/d_drive:ro
      - ${HOME}:${HOME}:ro
    ports:
      # Published so an MCP client can reach it directly, the way the sessions
      # are configured today. nginx also proxies /mcp, if you prefer one port.
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
