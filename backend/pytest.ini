[pytest]
asyncio_mode = auto
# Each test runs on its own function-scoped event loop (the default); the
# engine fixture is function-scoped to match, since asyncpg is loop-bound.
asyncio_default_fixture_loop_scope = function
testpaths = tests
# The repository root, so `tests/agent/` can reach the collectors, and `tools/`
# itself, so the agent's own modules import each other in a test exactly as they
# do on the host — `agent.py` is run as a script and finds `sources.py` beside
# it, and a test that had to reach them some other way would be testing an
# arrangement nobody runs. They are not part of the backend package and never
# will be, since they run on the host with no virtualenv, but this is the one
# pytest this project has, and a gate that cannot reach them is a gate that
# passes about files it never opened.
pythonpath = . .. ../tools
