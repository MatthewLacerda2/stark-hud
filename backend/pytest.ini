[pytest]
asyncio_mode = auto
# Each test runs on its own function-scoped event loop (the default); the
# engine fixture is function-scoped to match, since asyncpg is loop-bound.
asyncio_default_fixture_loop_scope = function
testpaths = tests
# The repository root, so `tests/agent/` can import `tools.agent` and the
# collectors. They are not part of the backend package and never will be — they
# run on the host with no virtualenv — but this is the one pytest this project
# runs, and a gate that cannot reach them is a gate that passes about files it
# never opened.
pythonpath = . ..
