[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# F: pyflakes, E/W: pycodestyle, B: bugbear, I: isort, UP: pyupgrade, ANN: annotations.
# ERA: commented-out code. RUF: ruff's own, and RUF100 is why it is here — a
# `noqa` for a rule nobody has enabled suppresses nothing and reads like it does.
# BLE: bare `except Exception`. SLF: reaching into another object's privates.
# ARG: arguments nothing uses.
#
# PLW0603, S104 and S108 are named on their own rather than as families: this tree has
# thirteen `noqa` comments explaining exactly these three, and the rest of PL (100
# magic values in tests) and S (483 asserts, also tests) is noise that would
# drown them. A rule set that has to be ignored everywhere is not a rule set.
select = ["F", "E", "W", "B", "I", "UP", "ANN", "ERA", "RUF", "BLE", "SLF", "ARG", "PLW0603", "S104", "S108"]
# E501 (line length) is owned by the formatter, not the linter.
# ANN401 forbids typing.Any, which we deliberately use for JWT payloads.
ignore = ["E501", "ANN401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection helpers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Tests do not need return-type annotations on every fixture/test function.
# A fixture is asked for by name and often only for its side effect, so an
# unused argument is the normal shape of a test rather than a mistake.
"tests/**" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "B008", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# No `python_version`: mypy then checks against the interpreter it is running
# under, which is the venv the Makefile built at $(PYTHON_VERSION). Pinning it
# here is how a type check comes to describe a Python nobody runs.
#
# The package root is `backend/`, which is not itself a package — without this,
# mypy finds `core.hub` and `backend.core.hub` and refuses to check anything.
explicit_package_bases = true
mypy_path = "."
# The backend only. `tools/` is checked by `make agent-types`, which names it on
# the command line — it is not part of this package and never will be.
files = ["api", "core", "repositories", "schemas", "services", "hud_mcp", "lint", "main.py"]
# Third-party packages that ship no stubs. Narrow on purpose: a blanket
# ignore_missing_imports hides our own typos as readily as somebody else's
# missing types.
[[tool.mypy.overrides]]
module = ["mcp.*", "mutagen.*"]
ignore_missing_imports = true

# What `tools/` imports and this venv deliberately does not have. Pillow is a
# dependency of `letterbox.py` alone, which is run with whichever python has it;
# `bpy` and `mathutils` exist only inside Blender. `convert` and `gpu` are ours,
# but each is reached the way a script reaches the file beside it rather than as
# part of a package — `mesh/samples.py` puts its own directory on sys.path at
# import time, and a collector simply is run from `collectors/`, so `gpu` is a
# top-level module there and nowhere else. Neither is a thing a type checker can
# follow, and widening MYPYPATH to cover the second makes the two `__init__.py`
# under `tools/` collide on the root module.
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "bpy", "bpy.*", "mathutils", "convert", "gpu"]
ignore_missing_imports = true
